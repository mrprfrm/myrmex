[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.uv]
dev-dependencies = [
    "ipdb>=0.13.13",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py310"

[tool.black]
line-length = 100 

[tool.isort]
profile = "black"

[project]
name = "antyr"
version = "0.1.5"
description = "The compact web crawling toolkit"
readme = "README.md"
requires-python = ">=3.10"
licence="MIT"
authors = [
    { name = "Anton Petrov", email = "mrprfrm@gmail.com" },
]
classifiers = [
    "Topic :: Internet :: WWW/HTTP",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
license-files = ["LICEN[CS]E*"]
dependencies = [
    "aiohttp>=3.10.11",
    "aiohttp-socks>=0.10.1",
    "result>=0.17.0",
    "stem>=1.8.2",
    "trio>=0.32.0",
    "httpx[socks]>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/mrprfrm/antyr"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build]
only-include = [
    "README.md",
    "LICENSE",
    "antyr",
    "tests",
]

[tool.hatch.build.targets.wheel]
only-include = ["myrmex", "LICENSE", "README.md"]
